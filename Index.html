<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>باهام آشنا میشی؟</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: Tahoma, 'Segoe UI', sans-serif;
  }
  body {
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 24px;
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(18px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes heartPop {
    0% { opacity: 0; transform: scale(0.7); }
    60% { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: linear-gradient(160deg, #f4f9ff 0%, #eaf3ff 100%);
    border-radius: 32px;
    padding: 48px 32px 40px;
    box-shadow: 0 24px 60px rgba(30, 90, 160, 0.18), 0 2px 0 rgba(255,255,255,0.6) inset;
    text-align: center;
    position: relative;
    overflow: hidden;
    animation: floatIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .blob-1, .blob-2 {
    position: absolute;
    border-radius: 50%;
  }
  .blob-1 {
    top: -40px;
    inset-inline-end: -40px;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, rgba(74,144,226,0.28), transparent 70%);
  }
  .blob-2 {
    bottom: -50px;
    inset-inline-start: -30px;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, rgba(120,190,255,0.28), transparent 70%);
  }
  .emoji { font-size: 40px; margin-bottom: 14px; }
  h1 {
    font-size: 24px;
    font-weight: 800;
    color: #12365e;
    margin: 0 0 10px;
    line-height: 1.6;
  }
  p {
    font-size: 14px;
    color: #5b7a9a;
    margin: 0 0 32px;
    line-height: 1.8;
  }
  .buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
    min-height: 56px;
  }
  button {
    font-family: inherit;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 18px;
    cursor: pointer;
  }
  #yesBtn {
    border: none;
    background: linear-gradient(135deg, #2f7fe0, #57a6ff);
    color: #ffffff;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(47, 127, 224, 0.4);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  #yesBtn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 24px rgba(47, 127, 224, 0.35);
  }
  #yesBtn:active {
    transform: translateY(0) scale(0.98);
  }
  #noBtn {
    border: 1.5px solid #cfe0f5;
    background: #ffffff;
    color: #4a6b8a;
    font-weight: 600;
    transition: transform 0.35s ease, opacity 0.35s ease;
  }
  #noBtn:hover {
    filter: brightness(1.08);
  }
  #thanks {
    display: none;
    animation: heartPop 0.5s ease;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="blob-1"></div>
    <div class="blob-2"></div>

    <div id="question">
      <div class="emoji">💌</div>
      <h1>باهام آشنا میشی؟</h1>
      <p>یه جواب ساده کافیه :)</p>
      <div class="buttons">
        <button id="yesBtn">آره</button>
        <button id="noBtn">نه</button>
      </div>
    </div>

    <div id="thanks">
      <div class="emoji" style="font-size:44px;">💙</div>
      <h1 style="margin:0;">مرسی که قبول کردی عزیزم</h1>
    </div>
  </div>

  <script>
    var noClicks = 0;
    var noBtn = document.getElementById('noBtn');
    var yesBtn = document.getElementById('yesBtn');
    var question = document.getElementById('question');
    var thanks = document.getElementById('thanks');

    noBtn.addEventListener('click', function () {
      if (noClicks >= 3) return;
      noClicks++;
      var scale = Math.max(1 - noClicks * 0.32, 0);
      var opacity = noClicks >= 3 ? 0 : 1 - noClicks * 0.28;
      noBtn.style.transform = 'scale(' + scale + ')';
      noBtn.style.opacity = opacity;
      if (noClicks >= 3) {
        setTimeout(function () {
          noBtn.style.display = 'none';
        }, 350);
      }
    });

    yesBtn.addEventListener('click', function () {
      question.style.display = 'none';
      thanks.style.display = 'block';
    });
  </script>
</body>
</html>
